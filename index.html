<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>hey mango</title>
<meta name="description" content="an unreasonable amount of effort" />
<meta name="theme-color" content="#08070c" />

<!-- FONTS — swap these and the three --font vars in :root -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════ 1. TOKENS ══════════════════════════ */
:root{
  --font-display:'Instrument Serif', Georgia, serif;
  --font-ui:'Space Grotesk', system-ui, -apple-system, sans-serif;
  --font-hand:'Caveat', 'Bradley Hand', cursive;
  --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;

  --void:#08070c;
  --lift:#131019;
  --paper:#f1ecf4;
  --muted:#948b9f;
  --line:rgba(241,236,244,.13);

  --violet:#a274ff;
  --mango:#ffab35;
  --mint:#5fe3c0;
  --stamp:#ff5d78;

  --pad:22px;
  --maxw:660px;
  --ease:cubic-bezier(.22,.75,.24,1);
}

/* ══════════════════════════ 2. BASE ══════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--void);color:var(--paper);
  font-family:var(--font-ui);font-size:16px;line-height:1.55;
  min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(46vmax 40vmax at 82% -6%, rgba(162,116,255,.20), transparent 62%),
    radial-gradient(50vmax 46vmax at 6% 104%, rgba(255,171,53,.13), transparent 60%),
    radial-gradient(40vmax 40vmax at 50% 50%, rgba(95,227,192,.05), transparent 66%);
  transition:filter .5s var(--ease);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
}
body.flash-mango::before{filter:hue-rotate(-40deg) saturate(1.6)}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:6px}
::selection{background:var(--violet);color:#120a20}

/* ══════════════════════════ 3. TYPE ══════════════════════════ */
h1,h2,h3,h4{margin:0;font-weight:400;line-height:1.04;letter-spacing:-.015em}
.big{font-family:var(--font-display);font-size:clamp(2.8rem,14vw,5rem)}
.mid{font-family:var(--font-display);font-size:clamp(2rem,9vw,3.1rem);line-height:1.06}
p{margin:0 0 .9em;max-width:56ch}
.lede{font-size:1.05rem;color:#d3ccdb}
.dim{color:var(--muted)}
.tiny{font-size:.73rem;line-height:1.5;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.mono.m{color:var(--mango)} .mono.g{color:var(--mint)} .mono.s{color:var(--stamp)} .mono.q{color:var(--muted)}
.hand{font-family:var(--font-hand);font-size:1.28rem;line-height:1.25;color:#e7dff0}

/* ══════════════════════════ 4. CHROME ══════════════════════════ */
#top{
  position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  background:linear-gradient(180deg,rgba(8,7,12,.93),rgba(8,7,12,.55) 72%,transparent);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  opacity:0;transform:translateY(-14px);transition:.6s var(--ease);
}
#top.on{opacity:1;transform:none}
#mark{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;color:#cec6d8;white-space:nowrap}
#mark svg{width:15px;height:15px;color:var(--mango)}
#rail{display:flex;gap:4px;margin-left:auto;margin-right:2px}
#rail button{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.16);padding:0;transition:.3s var(--ease)}
#rail button.done{background:rgba(162,116,255,.55)}
#rail button.here{background:var(--violet);transform:scale(1.55);box-shadow:0 0 10px var(--violet)}
.chip{font-family:var(--font-mono);font-size:.58rem;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.chip b{color:var(--mint);font-weight:500}
#bell{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;color:#cec6d8;transition:.25s;flex:0 0 auto}
#bell:hover{color:var(--mango);border-color:rgba(255,171,53,.5)}
#bell svg{width:15px;height:15px}
#bell.ring svg{animation:swing .55s var(--ease)}
@keyframes swing{25%{transform:rotate(18deg)}50%{transform:rotate(-14deg)}75%{transform:rotate(7deg)}}

#orb{
  position:fixed;right:15px;bottom:calc(env(safe-area-inset-bottom) + 15px);z-index:39;
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,#ffc96f,#e07d12 72%);
  box-shadow:0 8px 24px rgba(255,140,20,.28),inset 0 -6px 12px rgba(120,50,0,.35);
  opacity:0;transform:scale(.4);transition:.5s var(--ease)
}
#orb.on{opacity:1;transform:none}
#orb:active{transform:scale(.9)}
#orb svg{width:21px;height:21px;color:#3a1d00}

#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:60;
  width:min(400px,calc(100vw - 32px));transform:translate(-50%,16px);
  background:rgba(19,16,25,.97);border:1px solid var(--line);border-left:2px solid var(--violet);
  border-radius:11px;padding:12px 14px;box-shadow:0 18px 44px rgba(0,0,0,.62);
  opacity:0;pointer-events:none;transition:.35s var(--ease)
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .l{font-family:var(--font-mono);font-size:.58rem;letter-spacing:.15em;color:var(--violet);margin-bottom:3px;text-transform:uppercase}
#toast .b{font-size:.89rem;line-height:1.45}
#toast.m{border-left-color:var(--mango)} #toast.m .l{color:var(--mango)}
#toast.g{border-left-color:var(--mint)}   #toast.g .l{color:var(--mint)}
#toast.s{border-left-color:var(--stamp)}  #toast.s .l{color:var(--stamp)}

/* ══════════════════════════ 5. BOOT ══════════════════════════ */
#boot{position:fixed;inset:0;z-index:80;background:var(--void);display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);transition:opacity .7s var(--ease)}
#boot.gone{opacity:0;pointer-events:none}
#bootlog{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);max-width:420px}
#bootlog div{opacity:0;animation:up .5s var(--ease) forwards}
#bootlog b{color:var(--mango);font-weight:400}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{height:2px;width:min(420px,100%);background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--mango));animation:fill 2.4s var(--ease) forwards}
@keyframes fill{to{width:100%}}

/* ══════════════════════════ 6. LAYOUT ══════════════════════════ */
#stage{position:relative}
.scene{display:none;padding:96px var(--pad) 118px;max-width:var(--maxw);margin:0 auto}
.scene.live{display:block;animation:in .6s var(--ease) both}
.scene.live.center{display:flex;flex-direction:column;justify-content:center;min-height:100svh;padding-top:88px}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:var(--gap,18px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 24px;border-radius:999px;
  font-weight:500;font-size:.93rem;background:var(--paper);color:#140f1c;box-shadow:0 6px 22px rgba(0,0,0,.4);
  transition:transform .2s var(--ease),box-shadow .3s var(--ease),opacity .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(162,116,255,.28)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);box-shadow:none}
.btn.ghost:hover{border-color:rgba(162,116,255,.6);color:var(--violet)}
.btn.mini{padding:9px 15px;font-size:.79rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ── message bubbles ── */
.thread{display:flex;flex-direction:column;gap:9px;margin:4px 0}
.msg{max-width:82%;padding:10px 14px;border-radius:17px;font-size:.94rem;line-height:1.4;
  opacity:0;transform:translateY(9px) scale(.97);animation:pop .42s var(--ease) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.msg.her{align-self:flex-start;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.07);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,rgba(162,116,255,.32),rgba(162,116,255,.18));border:1px solid rgba(162,116,255,.32);border-bottom-right-radius:5px}
.msg .who{display:block;font-family:var(--font-mono);font-size:.53rem;letter-spacing:.15em;opacity:.55;margin-bottom:3px;text-transform:uppercase}
.dots{align-self:flex-start;display:flex;gap:4px;padding:12px 15px;background:rgba(255,255,255,.06);border-radius:17px;border-bottom-left-radius:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.28}30%{opacity:1}}

/* gap in the record */
.lost{align-self:center;text-align:center;width:100%;padding:11px 12px;border:1px dashed rgba(255,255,255,.18);
  border-radius:10px;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.13em;color:var(--muted);
  text-transform:uppercase;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 8px,transparent 8px 16px)}

/* ── handwritten note ── */
.note{position:relative;background:linear-gradient(160deg,rgba(255,171,53,.10),rgba(255,255,255,.035));
  border:1px solid rgba(255,171,53,.22);border-radius:4px 14px 6px 12px;padding:15px 17px;
  transform:rotate(-1.1deg);box-shadow:0 10px 26px rgba(0,0,0,.32)}
.note.alt{transform:rotate(1.3deg);border-color:rgba(162,116,255,.25);background:linear-gradient(160deg,rgba(162,116,255,.12),rgba(255,255,255,.03))}
.note .pin{position:absolute;top:-7px;left:22px;width:13px;height:13px;border-radius:50%;background:var(--stamp);box-shadow:0 3px 8px rgba(0,0,0,.5)}

/* ── cards / badges ── */
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(168deg,rgba(255,255,255,.06),rgba(255,255,255,.015))}
.card-top{display:flex;align-items:center;gap:13px;padding:14px;border-bottom:1px solid var(--line);background:linear-gradient(110deg,rgba(255,171,53,.15),rgba(162,116,255,.08))}
.card.retired .card-top{background:linear-gradient(110deg,rgba(148,139,159,.16),rgba(255,93,120,.07));filter:saturate(.6)}
.card-top .nm{font-family:var(--font-display);font-size:1.65rem;line-height:1}
.glyph{width:52px;height:52px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.09)}
.glyph svg{width:26px;height:26px;color:var(--mango)}
.card.retired .glyph svg{color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85rem}
.kv:last-child{border-bottom:none}
.kv span:first-child{font-family:var(--font-mono);font-size:.57rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding-top:4px;flex:0 0 auto}
.kv span:last-child{text-align:right}
.kv b{font-weight:500;color:var(--mango)}
.kv b.off{color:var(--stamp)}

/* ── system panel ── */
.panel{border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.28);padding:15px;
  font-family:var(--font-mono);font-size:.76rem;line-height:1.75;color:#c6bed2}
.panel .k{color:var(--muted)}
.panel .v{color:var(--paper)}
.panel .warn{color:var(--stamp)}
.panel .ok{color:var(--mint)}
.panel.alarm{border-color:rgba(255,93,120,.35);background:repeating-linear-gradient(135deg,rgba(255,93,120,.06) 0 10px,transparent 10px 20px)}

/* meter */
.meter{height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin:9px 0 4px}
.meter i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--mango),var(--stamp));animation:meter 1.6s var(--ease) forwards}
@keyframes meter{to{width:97%}}

/* ── stamp ── */
.stamp{display:inline-block;padding:7px 14px;border:2px solid var(--stamp);border-radius:6px;
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.2em;color:var(--stamp);transform:rotate(-4deg);opacity:.92}
.stamp.g{border-color:var(--mint);color:var(--mint)}
.stamp.q{border-color:var(--muted);color:var(--muted)}
.stamp.pop{animation:stampIn .45s var(--ease) both}
@keyframes stampIn{from{transform:rotate(-4deg) scale(2.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:.92}}

/* ── vertical chain ── */
.chain{display:flex;flex-direction:column;align-items:flex-start;margin-top:6px}
.step{opacity:0;transform:translateY(8px);transition:.45s var(--ease)}
.step.on{opacity:1;transform:none}
.step .t{font-family:var(--font-display);font-size:clamp(1.4rem,6.4vw,2.05rem);line-height:1.15}
.step.q .t{color:var(--muted)}
.step.hit .t{color:var(--mango)}
.step .arrow{color:var(--violet);opacity:.5;font-size:1rem;margin:2px 0 2px 3px;line-height:1}
.verdict{margin-top:14px}
.verdict div{opacity:0;transform:translateY(6px);transition:.5s var(--ease);font-size:.95rem;margin-bottom:4px}
.verdict div.on{opacity:1;transform:none}
.verdict div.strike{color:var(--muted);text-decoration:line-through}
.verdict div.final{font-family:var(--font-display);font-size:1.45rem;color:var(--mango)}

/* ── logic pills (hunger) ── */
.pills{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:4px}
.pill{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  font-size:.83rem;opacity:0;transform:scale(.92);transition:.35s var(--ease)}
.pill.on{opacity:1;transform:none}
.pill.no{border-color:rgba(255,93,120,.4);color:var(--stamp)}
.pill.key{border-color:rgba(255,171,53,.5);color:var(--mango)}
.pill.end{border-color:rgba(95,227,192,.45);color:var(--mint)}
.pills .ar{color:var(--violet);opacity:.45;font-size:.8rem;opacity:0;transition:.3s}
.pills .ar.on{opacity:.45}

/* ── annotations ── */
.an{position:relative;color:var(--paper);border-bottom:1px dashed rgba(162,116,255,.55);cursor:help}
.an::after{content:attr(data-an);position:absolute;left:50%;bottom:calc(100% + 9px);transform:translate(-50%,5px);
  width:max-content;max-width:min(250px,72vw);padding:8px 11px;background:var(--lift);border:1px solid var(--line);
  border-left:2px solid var(--mango);border-radius:9px;font-family:var(--font-hand);font-size:1.02rem;line-height:1.25;
  color:#e7dff0;letter-spacing:0;text-transform:none;opacity:0;pointer-events:none;transition:.25s var(--ease);
  box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:5}
.an:hover::after,.an:focus::after,.an.show::after{opacity:1;transform:translate(-50%,0)}

/* ── redacted ── */
.redact{display:inline-block;background:#221c2c;color:transparent;border-radius:3px;padding:0 7px;
  user-select:none;cursor:pointer;transition:.3s;border:1px solid rgba(255,255,255,.07)}
.redact:hover{background:#2c2437}
.redact.open{background:transparent;color:var(--stamp);border-color:transparent;padding:0}

/* ── soundtrack ── */
.strip{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.03)}
.strip-top{display:flex;align-items:center;gap:12px;padding:13px;background:linear-gradient(115deg,rgba(162,116,255,.2),rgba(255,171,53,.08));border-bottom:1px solid var(--line)}
.disc{width:50px;height:50px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(from 200deg,var(--violet),var(--mango),var(--mint),var(--violet));animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.disc span{width:11px;height:11px;border-radius:50%;background:var(--void)}
.eq{display:flex;align-items:flex-end;gap:2px;height:16px;margin-left:auto}
.eq i{width:3px;border-radius:2px;background:var(--mint);animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px;opacity:.5}50%{height:15px;opacity:1}}
.trk{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 13px;border-top:1px solid rgba(255,255,255,.05);transition:background .25s}
.trk:first-of-type{border-top:none}
.trk:hover{background:rgba(255,255,255,.045)}
.trk .n{font-family:var(--font-mono);font-size:.64rem;color:var(--muted);width:18px;flex:0 0 auto}
.trk .ti{font-size:.89rem}.trk .tc{font-size:.67rem;color:var(--muted)}
.trk .len{margin-left:auto;font-family:var(--font-mono);font-size:.64rem;color:var(--muted)}
.trk.on{background:rgba(162,116,255,.13)}.trk.on .ti{color:var(--violet)}
.inp{flex:1 1 165px;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;color:var(--paper);font:inherit;font-size:.87rem}
.inp::placeholder{color:#6d6579}
.inp:focus{outline:none;border-color:var(--violet)}

/* ── reveal ── */
.rv{opacity:0;transform:translateY(10px);transition:opacity .85s var(--ease),transform .85s var(--ease)}
.rv.on{opacity:1;transform:none}

/* ── ask + endings ── */
.q{font-family:var(--font-display);font-size:clamp(2.1rem,9.5vw,3.4rem);line-height:1.06;margin:12px 0 6px}
.choices{display:flex;gap:11px;margin-top:26px;flex-wrap:wrap}
.choice{min-width:128px;flex:1 1 auto;padding:17px 20px;border-radius:13px;border:1px solid var(--line);
  font-size:1rem;font-weight:500;background:rgba(255,255,255,.04);transition:.25s var(--ease)}
.choice:hover{transform:translateY(-2px)}
.choice.yes{border-color:rgba(255,171,53,.55)}
.choice.yes:hover{background:rgba(255,171,53,.15)}
.choice.no:hover{background:rgba(255,255,255,.09);border-color:rgba(241,236,244,.35)}
.pair{font-family:var(--font-display);font-size:clamp(2rem,9vw,3.1rem);line-height:1.05;margin:14px 0 8px}
.pair em{color:var(--mango);font-style:italic}
#confetti{position:fixed;inset:0;z-index:55;pointer-events:none;display:none}

/* ── signature ── */
.sig{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.57rem;
  letter-spacing:.12em;color:var(--muted);margin-top:30px;text-transform:uppercase;text-align:left}
.sig svg{width:14px;height:14px;color:rgba(255,171,53,.5);flex:0 0 auto}
.sig:hover svg{color:var(--mango)}

/* ══════════════════════════ 7. RESPONSIVE ══════════════════════════ */
@media (min-width:620px){
  :root{--pad:34px}
  .msg{max-width:72%}
  .scene{padding-top:110px}
}
@media (max-width:400px){ #mark span{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.05s!important}
}
</style>
</head>
<body>

<div id="boot"><div id="bootlog"></div><div class="bar"><i></i></div></div>

<header id="top">
  <button id="mark">

  keywords:{

    cupcake:["retired","That name is no longer in service."],
    pavlov:["conditioning","The bell is in the top bar. Obviously."],

    clown:["costume dept.","Red lipstick and everything. Your words."],
    lashes:["recurring","Still unnecessarily long."],

/* ═══════════════════════════════════════════════════════════════════
   ███  MACHINERY  ███
   ═══════════════════════════════════════════════════════════════════ */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const noMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const SVG_MANGO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.4 0-7.5-3-7.5-7 0-4.2 3.6-8 8-8 1.4 0 2.4.3 3.2.8.6-1.4 1.6-2.4 2.8-2.8.3 1.6.1 3-.6 4.1 1 1.4 1.6 3.3 1.6 5.4 0 4.3-3.1 7.5-7.5 7.5Z"/></svg>';
const SVG_CUPCAKE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12l-1.4 8.2a1 1 0 0 1-1 .8H8.4a1 1 0 0 1-1-.8Z"/><path d="M6 11a3 3 0 0 1 .6-5.4A3.4 3.4 0 0 1 12 3a3.4 3.4 0 0 1 5.4 2.6A3 3 0 0 1 18 11"/></svg>';

/* ── easter egg counter ── */
const EGGS=['retire','trace','wait','replay','lashlog','lashnote','ibsen','noranote','logic','plan','frag','fragdel','ost','bias','bell','orb','mark','sig','type'];
const found=new Set();
$('#cntT').textContent=EGGS.length;
function egg(id){
  if(found.has(id))return;
  found.add(id);$('#cnt').textContent=found.size;
  if(found.size===EGGS.length)setTimeout(()=>say("everything found","You found all of it. Of course you did.","g"),1000);
}

/* ── toast ── */
let tT;
function say(label,body,kind=""){
  $('#tl').textContent=label;$('#tb').innerHTML=body;
  const t=$('#toast');t.className="on "+kind;
  clearTimeout(tT);tT=setTimeout(()=>t.className=kind,3800);
}

/* ── persistent chrome ── */
let bellN=0;
$('#bell').onclick=()=>{
  egg('bell');
  $('#bell').classList.add('ring');setTimeout(()=>$('#bell').classList.remove('ring'),560);
  say("pavlov",CONFIG.bellLines[Math.min(bellN,CONFIG.bellLines.length-1)],bellN>=3?"g":"m");
  bellN++;
};
let orbN=0;
$('#orb').onclick=()=>{
  egg('orb');
  const p=CONFIG.orbLines[orbN++%CONFIG.orbLines.length];
  document.body.classList.add('flash-mango');setTimeout(()=>document.body.classList.remove('flash-mango'),450);
  say(p[0],p[1],"m");
};
let markN=0;
$('#mark').onclick=()=>{egg('mark');say("staff",CONFIG.markLines[markN++%CONFIG.markLines.length],"");};

let typed="";
document.addEventListener('keydown',e=>{
  if(e.key.length!==1||e.target.tagName==='INPUT')return;
  typed=(typed+e.key.toLowerCase()).slice(-10);
  for(const k in CONFIG.keywords){
    if(typed.endsWith(k)){egg('type');say(CONFIG.keywords[k][0],CONFIG.keywords[k][1]);typed="";}
  }
});

/* ── small builders ── */
function sig(){
  const b=el('button','sig',SVG_CUPCAKE+' signed, out of habit, by cupcake');
  b.onclick=()=>{egg('sig');say("signature","A retired nickname doing unpaid work.","m");};
  return b;
}
const kicker=(t,c='')=>el('div','mono '+c,t);
function nextBtn(label,to,ghost){
  const r=el('div','row');const b=el('button','btn'+(ghost?' ghost':''),label);
  b.onclick=()=>go(to);r.append(b);return r;
}
function thread(msgs,{delay=300,start=250}={}){
  const t=el('div','thread');
  msgs.forEach(([w,txt],i)=>{
    let m;
    if(w==='gap'){m=el('div','lost','[ '+txt+' ]');m.style.animation='pop .42s var(--ease) forwards';m.style.opacity='0';}
    else m=el('div','msg '+w,'<span class="who">'+(w==='me'?'me':'her')+'</span>'+txt);
    m.style.animationDelay=(noMotion()?0:start+i*delay)+'ms';
    t.append(m);
  });
  return t;
}
function note(text,alt){return el('div','note'+(alt?' alt':''),'<span class="pin"></span><div class="hand">'+text+'</div>');}
function kvCard(icon,name,rows,retired){
  const c=el('div','card'+(retired?' retired':''));
  c.append(el('div','card-top','<div class="glyph">'+icon+'</div><div><div class="nm">'+name+'</div>'+
    (retired?'<div class="tiny">no longer in service</div>':'<div class="tiny">currently in use</div>')+'</div>'));
  rows.forEach(([k,v])=>{
    const hot=(v==='active');const off=(v==='retired');
    c.append(el('div','kv','<span>'+k+'</span><span>'+(hot?'<b>'+v+'</b>':off?'<b class="off">'+v+'</b>':v)+'</span>'));
  });
  return c;
}
function panel(rows,alarm){
  return el('div','panel'+(alarm?' alarm':''),rows.map(([k,v])=>
    '<div><span class="k">'+k+':</span> <span class="'+((v==='ARCHIVED'||v==='CRITICAL'||v==='rejected')?'warn':'v')+'">'+v+'</span></div>').join(''));
}

/* ═══ SCENES ═══════════════════════════════════════════════════ */
const ORDER=['hook','names','pavlov','clown','lashes','nora','hunger','old','ost','sweet','ask'];
const S={};

/* 1 — HOOK */
S.hook=()=>{
  const s=el('section','scene center stack');s.style.setProperty('--gap','14px');
  const h=el('h1','big rv',CONFIG.hook.hi);
  const a=el('p','lede rv',CONFIG.hook.beat1);
  const b=el('p','lede rv','<span style="color:var(--violet)">'+CONFIG.hook.beat2+'</span>');
  const r=el('div','row rv');
  const btn=el('button','btn',CONFIG.hook.cta);btn.onclick=()=>go('names');r.append(btn);
  const hint=el('p','tiny rv',CONFIG.hook.hint);
  s.append(h,a,b,r,hint,sig());
  [[h,300],[a,1100],[b,2400],[r,3200],[hint,3600]].forEach(([n,d])=>
    setTimeout(()=>n.classList.add('on'),noMotion()?0:d));
  return s;
};

/* 2 — THE TWO NAMES */
S.names=()=>{
  const s=el('section','scene stack');s.style.setProperty('--gap','16px');
  s.append(kicker(CONFIG.names.kicker,'m'),el('h2','mid',CONFIG.names.title));
  s.append(kvCard(SVG_MANGO,CONFIG.names.mango.nm,CONFIG.names.mango.rows,false));
  s.append(kvCard(SVG_CUPCAKE,CONFIG.names.cup.nm,CONFIG.names.cup.rows,true));

  const r=el('div','row');
  const b=el('button','btn ghost mini',CONFIG.names.lookupBtn);
  b.onclick=()=>{egg('retire');say("notice",CONFIG.names.lookup,"");b.disabled=true;};
  r.append(b);
  s.append(r,note(CONFIG.names.note),nextBtn(CONFIG.names.cta,'pavlov'),sig());
  return s;
};

/* 3 — PAVLOV / COOKIE / MANGO */
S.pavlov=()=>{
  const s=el('section','scene stack');s.style.setProperty('--gap','16px');
  s.append(kicker(CONFIG.pavlov.kicker),el('h2','mid',CONFIG.pavlov.title),el('p','dim',CONFIG.pavlov.intro));
  s.append(thread(CONFIG.pavlov.thread,{delay:560,start:500}));

  const beat=el('p','tiny rv',CONFIG.pavlov.beat);
  const after=el('p','lede rv',CONFIG.pavlov.after);
  s.append(beat,after);
  setTimeout(()=>beat.classList.add('on'),noMotion()?0:2700);
  setTimeout(()=>after.classList.add('on'),noMotion()?0:3300);

  const r=el('div','row');
  const tb=el('button','btn',CONFIG.pavlov.traceBtn);r.append(tb);
  s.append(r);

  const chain=el('div','chain'),verdict=el('div','verdict');
  s.append(chain,verdict);

  const cont=el('div','row rv');
  const cb=el('button','btn ghost',CONFIG.pavlov.cta);cb.onclick=()=>go('clown');cont.append(cb);

  let done=false;
  tb.onclick=async()=>{
    if(done)return;done=true;egg('trace');
    tb.disabled=true;tb.textContent="Tracing…";
    for(let i=0;i<CONFIG.pavlov.chain.length;i++){
      const txt=CONFIG.pavlov.chain[i];
      const isWait=(txt==="WAIT."),isHit=(txt==="MANGO"),isQ=(txt==="HOW DID WE GET HERE?");
      const step=el('div','step'+(isQ?' q':'')+(isHit?' hit':''),
        (i?'<div class="arrow">↓</div>':'')+'<div class="t">'+txt+'</div>');
      chain.append(step);
      await wait(noMotion()?0:40);
      step.classList.add('on');
      if(isWait){
        step.style.cursor='pointer';
        step.onclick=()=>{egg('wait');say(CONFIG.pavlov.waitToast[0],CONFIG.pavlov.waitToast[1]);};
      }
      await wait(noMotion()?0:(isWait?1100:520));
    }
    const v1=el('div','',CONFIG.pavlov.verdict[0]);
    const v2=el('div','final',CONFIG.pavlov.verdict[1]);
    verdict.append(v1);await wait(noMotion()?0:400);v1.classList.add('on');
    await wait(noMotion()?0:800);verdict.append(v2);await wait(40);v2.classList.add('on');
    tb.textContent="Trace complete (inconclusive)";
    say("origin","Investigation open. Indefinitely.","m");
    s.append(cont,sig());await wait(60);cont.classList.add('on');
  };
  return s;
};

/* 4 — CLOWN COSTUME */
S.clown=()=>{
  const s=el('section','scene stack');s.style.setProperty('--gap','16px');
  s.append(kicker(CONFIG.clown.kicker,'s'),el('h2','mid',CONFIG.clown.title),el('p','dim',CONFIG.clown.before));

  const box=el('div','');
  const r=el('div','row');
  const rb=el('button','btn',CONFIG.clown.replayBtn);r.append(rb);
  const out=el('div','stack');out.style.setProperty('--gap','10px');
  s.append(r,box,out);

  const cont=el('div','row rv');
  const cb=el('button','btn ghost',CONFIG.clown.cta);cb.onclick=()=>go('lashes');cont.append(cb);

  let busy=false,first=true;
  rb.onclick=async()=>{
    if(busy)return;busy=true;egg('replay');
    rb.disabled=true;box.innerHTML='';out.innerHTML='';
    const t=el('div','thread');box.append(t);
    for(const [w,txt] of CONFIG.clown.thread){
      if(w==='gap'){
        const g=el('div','lost','[ '+txt+' ]');
        g.style.opacity='0';g.style.animation='pop .5s var(--ease) forwards';
        t.append(g);await wait(noMotion()?0:1400);continue;
      }
      if(!noMotion()){
        const d=el('div','dots','<i></i><i></i><i></i>');
        if(w==='me')d.style.alignSelf='flex-end';
        t.append(d);await wait(620);d.remove();
      }
      const m=el('div','msg '+w,'<span class="who">'+(w==='me'?'me':'her')+'</span>'+txt);
      m.style.animationDelay='0ms';t.append(m);
      await wait(noMotion()?0:850);
    }
    await wait(noMotion()?0:450);
    const o=el('p','lede rv',CONFIG.clown.out);
    out.append(o,el('div','stamp q pop',CONFIG.clown.stamp));
    await wait(40);o.classList.add('on');
    rb.disabled=false;rb.textContent=CONFIG.clown.replayAgain;busy=false;
    if(first){first=false;s.append(cont,sig());await wait(60);cont.classList.add('on');}
  };
  return s;
};

/* 5 — THE LASHES */
S.lashes=()=>{
  const s=el('section','scene stack');s.style.setProperty('--gap','16px');
  s.append(kicker(CONFIG.lashes.kicker,'g'),el('h2','mid',CONFIG.lashes.title));
  s.append(el('p','lede','<span class="an" tabindex="0" data-an="still unnecessarily long">'+CONFIG.lashes.subject+'</span>'));
  const an=s.querySelector('.an');
  ['mouseenter','focus'].forEach(ev=>an.addEventListener(ev,()=>egg('lashnote')));
  an.addEventListener('click',()=>{an.classList.toggle('show');egg('lashnote');});

  s.append(panel(CONFIG.lashes.rows));

  const r=el('div','row');
  const b=el('button','btn ghost mini',CONFIG.lashes.btn);
  let n=0;
  b.onclick=()=>{
    egg('lashlog');

/* 7 — THE HUNGER INCIDENT */
S.hunger=()=>{
  const s=el('section','scene stack');s.style.setProperty('--gap','16px');
  s.append(kicker(CONFIG.hunger.kicker,'s'),el('h2','mid',CONFIG.hunger.title),el('p','dim',CONFIG.hunger.intro));

  const p=panel(CONFIG.hunger.rows,true);
  p.insertBefore(el('div','meter','<i></i>'),p.children[1]);
  s.append(p);

  const r=el('div','row');
  const rb=el('button','btn',CONFIG.hunger.runBtn);r.append(rb);
  const pills=el('div','pills');
  const vd=el('p','lede rv',CONFIG.hunger.verdict);
  s.append(r,pills,vd);

  const cont=el('div','row rv');
  const cb=el('button','btn ghost',CONFIG.hunger.cta);cb.onclick=()=>go('old');cont.append(cb);

  let done=false;
  rb.onclick=async()=>{
    if(done)return;done=true;egg('logic');
    rb.disabled=true;rb.textContent="Running…";
    for(let i=0;i<CONFIG.hunger.steps.length;i++){
      const [txt,kind]=CONFIG.hunger.steps[i];
      if(i){const a=el('span','ar','→');pills.append(a);await wait(noMotion()?0:30);a.classList.add('on');}
      const pl=el('span','pill '+(kind||''),txt);
      pills.append(pl);await wait(noMotion()?0:40);pl.classList.add('on');
      await wait(noMotion()?0:620);
    }
    rb.textContent="Logic complete (unsound)";
    await wait(noMotion()?0:400);vd.classList.add('on');
    s.append(cont,sig());await wait(60);cont.classList.add('on');
  };
  return s;
};

/* ═══ SCENE MANAGER ════════════════════════════════════════════ */
let cur=null,curName=null;
const visited=new Set();

function buildRail(){
  const rail=$('#rail');rail.innerHTML='';
  ORDER.forEach((name,i)=>{
    const b=document.createElement('button');
    b.setAttribute('aria-label','section '+(i+1));
    if(visited.has(name))b.classList.add('done');
    if(name===curName)b.classList.add('here');
    b.onclick=()=>{if(visited.has(name))go(name);};
    rail.append(b);
  });
}

function go(name){
  const nx=S[name]();
  nx.classList.add('live');
  if(cur){const old=cur;old.style.transition='opacity .28s';old.style.opacity='0';setTimeout(()=>old.remove(),290);}
  $('#stage').append(nx);
  cur=nx;curName=name;
  if(ORDER.includes(name))visited.add(name);
  buildRail();
  window.scrollTo(0,0);
}

/* ═══ CONFETTI ═════════════════════════════════════════════════ */
function confetti(){
  if(noMotion())return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');
  const dpr=Math.min(devicePixelRatio||1,2);
  const W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr;
  cv.style.display='block';
  const cols=['#ffab35','#a274ff','#5fe3c0','#f1ecf4','#ff5d78'];
  const bits=Array.from({length:130},()=>({
    x:Math.random()*W,y:-Math.random()*H*.5,
    w:(5+Math.random()*7)*dpr,h:(7+Math.random()*9)*dpr,
    vy:(2.2+Math.random()*3.4)*dpr,vx:(Math.random()-.5)*2.4*dpr,
    r:Math.random()*Math.PI,vr:(Math.random()-.5)*.22,
    c:cols[(Math.random()*cols.length)|0],round:Math.random()<.3
  }));
  const t0=performance.now();
  (function f(t){
    const life=t-t0;ctx.clearRect(0,0,W,H);
    bits.forEach(b=>{
      b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.vy+=.015*dpr;
      if(b.y>H+40*dpr){b.y=-30*dpr;b.x=Math.random()*W;}
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;
      ctx.globalAlpha=life>4200?Math.max(0,1-(life-4200)/1600):1;
      if(b.round){ctx.beginPath();ctx.arc(0,0,b.w/2,0,7);ctx.fill();}
      else ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.restore();
    });
    if(life<5900)requestAnimationFrame(f);
    else{ctx.clearRect(0,0,W,H);cv.style.display='none';}
  })(t0);
}
